services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10MB"

  api1:
    image: ghcr.io/obrunogonzaga/rinha-fraud-rust:v0.5.0
    environment:
      TOKIO_WORKER_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      REFS_DATA_DIR: "/data"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api2:
    image: ghcr.io/obrunogonzaga/rinha-fraud-rust:v0.5.0
    environment:
      TOKIO_WORKER_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      REFS_DATA_DIR: "/data"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

networks:
  default:
    driver: bridge
